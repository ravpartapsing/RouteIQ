name: routeiq_driver
description: RouteIQ Driver App — Static demo build for RouteIQ TMS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management — lightweight, no code gen
  provider: ^6.1.2

  # Icons
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.19.0

  # Networking
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
